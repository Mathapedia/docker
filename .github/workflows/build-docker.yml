name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "tex/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/latex

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # amd64 only for the smoke test (fast); the multi-arch push happens below.
      - name: Build (amd64, load locally)
        uses: docker/build-push-action@v6
        with:
          context: latex
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test tools and packages
        run: make check RUN_IMAGE=${{ env.IMAGE }}:ci

      - name: Compile test document (latex -> dvips -> ps2pdf)
        run: make clean-latex pstricks RUN_IMAGE=${{ env.IMAGE }}:ci

      - uses: actions/upload-artifact@v4
        with:
          name: test.pdf
          path: tex/test.pdf

      - name: Push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: latex
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
